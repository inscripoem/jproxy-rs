[package]
name = "jproxy-rs"
version = "0.1.0"
edition = "2024"
description = "Rust implementation of the jproxy Torznab proxy for Sonarr and Radarr"
license = "MIT"
repository = "https://github.com/inscripoem/jproxy-rs"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
chrono = "0.4.45"
futures-util = "0.3.34"
getrandom = "0.2"
hmac = "0.12"
libc = "0.2.191"
md-5 = "0.10"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "query", "http2", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync", "fs"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
